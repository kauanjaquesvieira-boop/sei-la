<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Cobrinha - WebDev</title>
    <style>
        :root {
            --bg-body: #090d16;
            --bg-card: rgba(30, 41, 59, 0.75);
            --bg-button: rgba(51, 65, 85, 0.8);
            --bg-button-hover: #475569;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --food-color: #ec4899;
            --food-glow: rgba(236, 72, 153, 0.5);
            --border: rgba(255, 255, 255, 0.1);
            --grid-color: rgba(255, 255, 255, 0.03);
        }

        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.12) 0%, transparent 50%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-primary);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 440px;
            width: 100%;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 1.8rem;
            color: var(--accent);
            text-shadow: 0 0 12px var(--accent-glow);
        }

        .score-board {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .score-board span {
            color: var(--text-primary);
        }

        canvas {
            background: #0f172a;
            border: 2px solid var(--border);
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.5);
            touch-action: none;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 8px;
            margin-top: 20px;
            justify-content: center;
        }

        .btn-ctrl {
            background: var(--bg-button);
            border: 1px solid var(--border);
            color: var(--text-primary);
            font-size: 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .btn-ctrl:active {
            background: var(--accent);
            color: #000;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        .btn-restart {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .btn-restart:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>🐍 Snake Game</h1>
        
        <div class="score-board">
            <div>Pontuação: <span id="score">0</span></div>
            <div>Recorde: <span id="high-score">0</span></div>
        </div>

        <canvas id="gameCanvas" width="360" height="360"></canvas>

        <div class="controls">
            <button class="btn-ctrl btn-up" onclick="changeDirection('UP')">▲</button>
            <button class="btn-ctrl btn-left" onclick="changeDirection('LEFT')">◀</button>
            <button class="btn-ctrl btn-down" onclick="changeDirection('DOWN')">▼</button>
            <button class="btn-ctrl btn-right" onclick="changeDirection('RIGHT')">▶</button>
        </div>

        <button class="btn-restart" onclick="resetGame()">Reiniciar Jogo</button>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const gridSize = 18; // Tamanho de cada quadrado
        const tileCount = canvas.width / gridSize; // 20x20 blocos

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 5, y: 5 };
        let dx = 1;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem("snakeHighScore") || 0;
        let gameInterval = null;
        let gameRunning = false;

        document.getElementById("high-score").textContent = highScore;

        // Controles de teclado
        window.addEventListener("keydown", (e) => {
            switch (e.key) {
                case "ArrowUp": case "w": case "W":
                    changeDirection('UP'); break;
                case "ArrowDown": case "s": case "S":
                    changeDirection('DOWN'); break;
                case "ArrowLeft": case "a": case "A":
                    changeDirection('LEFT'); break;
                case "ArrowRight": case "d": case "D":
                    changeDirection('RIGHT'); break;
            }
        });

        function changeDirection(dir) {
            if (!gameRunning) startGame();

            if (dir === 'UP' && dy === 0) { dx = 0; dy = -1; }
            if (dir === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
            if (dir === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
            if (dir === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
        }

        function startGame() {
            gameRunning = true;
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, 100);
        }

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            document.getElementById("score").textContent = score;
            generateFood();
            startGame();
        }

        function generateFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            // Evita gerar comida em cima da cobra
            snake.forEach(segment => {
                if (segment.x === food.x && segment.y === food.y) generateFood();
            });
        }

        function gameLoop() {
            // Nova posição da cabeça
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Colisão com as paredes
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return gameOver();
            }

            // Colisão com o próprio corpo
            for (let i = 0; i < snake.length; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return gameOver();
                }
            }

            snake.unshift(head);

            // Verificar se comeu a comida
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById("score").textContent = score;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem("snakeHighScore", highScore);
                    document.getElementById("high-score").textContent = highScore;
                }
                generateFood();
            } else {
                snake.pop(); // Remove o rabo se não comeu
            }

            draw();
        }

        function draw() {
            // Limpar Tela
            ctx.fillStyle = "#0f172a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenhar Comida (Rosa Neón)
            ctx.fillStyle = "#ec4899";
            ctx.shadowColor = "#ec4899";
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2, 
                food.y * gridSize + gridSize / 2, 
                gridSize / 2 - 2, 0, Math.PI * 2
            );
            ctx.fill();

            // Desenhar Cobra (Azul Neón)
            ctx.shadowColor = "#38bdf8";
            ctx.shadowBlur = 8;
            snake.forEach((segment, index) => {
                ctx.fillStyle = index === 0 ? "#7dd3fc" : "#38bdf8";
                ctx.fillRect(
                    segment.x * gridSize + 1, 
                    segment.y * gridSize + 1, 
                    gridSize - 2, 
                    gridSize - 2
                );
            });

            ctx.shadowBlur = 0; // Limpar sombras para otimizar
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameRunning = false;
            
            ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ef4444";
            ctx.font = "bold 24px system-ui";
            ctx.textAlign = "center";
            ctx.fillText("Fim de Jogo!", canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = "#f8fafc";
            ctx.font = "14px system-ui";
            ctx.fillText("Pressione Reiniciar para jogar", canvas.width / 2, canvas.height / 2 + 20);
        }

        // Inicialização
        generateFood();
        draw();
    </script>
</body>
</html>
